name: Performance evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to measure
        required: true
        type: string
      reason:
        description: Milestone or release that requires fresh performance evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  performance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Verify the requested exact head
        env:
          EXPECTED_REF: ${{ inputs.ref }}
        run: bash eng/verify-exact-head.sh "$EXPECTED_REF"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-performance-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet performancers --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-performance-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"performancers",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-performance-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Prepare evidence manifest
        env:
          EVIDENCE_REASON: ${{ inputs.reason }}
          EVIDENCE_REF: ${{ inputs.ref }}
        run: |
          mkdir -p artifacts/performance
          {
            echo "commit=$GROUNDWORK_TESTED_SHA"
            echo "requested_ref=$EVIDENCE_REF"
            echo "workflow_ref=$GITHUB_REF"
            echo "runner=$RUNNER_NAME"
            echo "reason=$EVIDENCE_REASON"
            dotnet --info
          } | tee artifacts/performance/manifest.txt
      - name: Measure Records hot paths
        run: |
          set -o pipefail
          dotnet run --project benchmarks/Groundwork.Benchmarks --no-restore --configuration Release -- \
            records --n 10000 | tee artifacts/performance/records.txt
      - name: Measure SQLite write round trips
        run: |
          set -o pipefail
          dotnet run --project benchmarks/Groundwork.Benchmarks --no-restore --configuration Release -- \
            roundtrips --workload upsert --n 1 | tee artifacts/performance/roundtrips-sqlite.txt
      - name: Measure PostgreSQL write round trips
        env:
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
        run: |
          set -o pipefail
          dotnet run --project benchmarks/Groundwork.Benchmarks --no-restore --configuration Release -- \
            roundtrips --provider postgresql --workload upsert --n 1 | tee artifacts/performance/roundtrips-postgresql.txt
      - name: Measure SQL Server write round trips
        env:
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: |
          set -o pipefail
          dotnet run --project benchmarks/Groundwork.Benchmarks --no-restore --configuration Release -- \
            roundtrips --provider sqlserver --workload upsert --n 1 | tee artifacts/performance/roundtrips-sqlserver.txt
      - name: Measure MongoDB write round trips
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/performanceci?replicaSet=performancers&directConnection=true
        run: |
          set -o pipefail
          dotnet run --project benchmarks/Groundwork.Benchmarks --no-restore --configuration Release -- \
            roundtrips --provider mongodb --workload upsert --n 1 | tee artifacts/performance/roundtrips-mongodb.txt
      - name: Publish performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence-${{ inputs.ref }}-${{ github.run_attempt }}
          path: artifacts/performance/**
          if-no-files-found: error
          retention-days: 30
