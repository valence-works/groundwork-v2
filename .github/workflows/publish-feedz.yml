name: Publish Feedz packages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact SemVer package version for a controlled dry run or release
        required: false
        type: string
      publish:
        description: Push the validated packages to Feedz
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-feedz-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  FEEDZ_NUGET_SOURCE: https://f.feedz.io/valence-works/groundwork/nuget/index.json

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${RELEASE_TAG#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="0.1.0-preview.${GITHUB_RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z.-]+)?$ ]] || {
            echo "Invalid package version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Groundwork v2 packages at $version"
      - name: Restore the full solution
        run: dotnet restore Groundwork.slnx --nologo
      - name: Run the full test suite
        run: dotnet test Groundwork.slnx --configuration Release --no-restore --nologo
      - name: Build and verify the public documentation gate
        run: |
          eng/build-docs.sh
          eng/verify-docs-site.sh
      - name: Run packaging contract tests
        run: dotnet test tests/Groundwork.Packaging.Tests/Groundwork.Packaging.Tests.csproj --configuration Release --no-restore --nologo
      - name: Pack the explicit public package allowlist
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: eng/pack-public-packages.sh artifacts/packages "$PACKAGE_VERSION"
      - name: Validate package contents and allowlist
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: eng/verify-package-layout.sh artifacts/packages "$PACKAGE_VERSION"
      - name: Run the clean-room public API and tool proof from these artifacts
        env:
          GROUNDWORK_PUBLIC_API_PACKAGES: artifacts/packages
          GROUNDWORK_PUBLIC_API_VERSION: ${{ steps.version.outputs.version }}
        run: tests/Groundwork.PublicApi.Acceptance.Tests/verify-clean-room.sh
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-packages-${{ steps.version.outputs.version }}
          path: artifacts/packages
          if-no-files-found: error

  publish:
    needs: package
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    environment: feedz
    outputs:
      version: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: groundwork-packages-*
          merge-multiple: true
          path: artifacts/packages
      - name: Require the Feedz credential and source
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
        run: |
          test -n "$FEEDZ_API_KEY"
          test -n "$FEEDZ_NUGET_SOURCE"
      - name: Push packages to Feedz
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          for package in artifacts/packages/*."$PACKAGE_VERSION".nupkg; do
            test -f "$package"
            dotnet nuget push "$package" --api-key "$FEEDZ_API_KEY" --source "$FEEDZ_NUGET_SOURCE" --skip-duplicate
          done
      - name: Push symbol packages to Feedz with retry
        env:
          FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          for package in artifacts/packages/*."$PACKAGE_VERSION".snupkg; do
            test -f "$package"
            pushed=false
            for attempt in {1..12}; do
              if dotnet nuget push "$package" --api-key "$FEEDZ_API_KEY" --source "$FEEDZ_NUGET_SOURCE" --skip-duplicate; then
                pushed=true
                break
              fi
              if [[ "$attempt" -lt 12 ]]; then
                echo "Feedz has not admitted the symbol package yet; retrying ($attempt/12)." >&2
                sleep 10
              fi
            done
            [[ "$pushed" == true ]] || {
              echo "Could not publish symbol package $package to Feedz." >&2
              exit 1
            }
          done

  verify-feed:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: groundwork-packages-*
          merge-multiple: true
          path: artifacts/packages
      - name: Restore every public package and the tool from Feedz
        env:
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
        run: eng/verify-published-packages.sh "$FEEDZ_NUGET_SOURCE" "$PACKAGE_VERSION" artifacts/packages
