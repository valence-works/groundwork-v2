name: Documentation verification

on:
  push:
    paths:
      - README.md
      - docs/**
      - samples/**
      - eng/verify-documentation.py
      - eng/verify-api-reference.py
      - eng/api-documentation-baseline.json
      - eng/generate-provider-matrices.sh
      - eng/provider-matrix/**
      - docs/v2/generated/**
      - docs/v2/executable-snippets.json
      - .github/workflows/documentation-evidence.yml
      - .github/workflows/documentation-verification.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - samples/**
      - eng/verify-documentation.py
      - eng/verify-api-reference.py
      - eng/api-documentation-baseline.json
      - eng/generate-provider-matrices.sh
      - eng/provider-matrix/**
      - docs/v2/generated/**
      - docs/v2/executable-snippets.json
      - .github/workflows/documentation-evidence.yml
      - .github/workflows/documentation-verification.yml

permissions:
  contents: read

concurrency:
  group: documentation-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify Markdown links, anchors, and executable snippets
        run: python3 eng/verify-documentation.py
      - name: Verify generated package and provider matrices
        run: bash eng/generate-provider-matrices.sh check
