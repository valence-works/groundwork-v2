  stream-capabilities-retention:
    runs-on: ubuntu-latest
    env:
      GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
      GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
      GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/s3ci?replicaSet=s3rs&directConnection=true
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set for native retention
        run: |
          docker run --detach --name groundwork-s3-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet s3rs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-s3-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"s3rs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-s3-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
      # Each target framework runs Retention separately, with its own trx: a single invocation builds and
      # runs both net8.0 and net10.0, and the second run's trx silently overwrites the first's, which would
      # let one framework's OnAppend coalescing proofs go unchecked below.
      - name: Run four-provider retention proof (net8.0)
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter Retention --framework net8.0
          --logger "trx;LogFileName=stream-capabilities-retention-net8.0.trx"
          --results-directory artifacts/stream-capabilities-retention
      - name: Run four-provider retention proof (net10.0)
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter Retention --framework net10.0
          --logger "trx;LogFileName=stream-capabilities-retention-net10.0.trx"
          --results-directory artifacts/stream-capabilities-retention
      # A skipped OnAppend coalescing proof is a Skip.If, not a failure: it reads as inconclusive rather than
      # a verified pass, which is the whole point, but only if something checks for it. Left unchecked, a
      # busy runner would make the skip routine and the coalescing property would quietly stop being
      # verified -- the same "an assertion standing in for the thing it claims" defect the retry in
      # RetentionProofTests exists to avoid. This asserts every OnAppend coalescing proof actually executed,
      # on both target frameworks.
      - name: Refuse a run whose OnAppend coalescing proofs did not execute
        run: |
          proofs="PostgreSQL_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline
          SQLServer_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline
          SQLite_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline
          SQLite_in_memory_OnAppend_serializes_the_shared_connection_and_coalesces_cleanup
          MongoDB_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline"
          for tfm in net8.0 net10.0; do
            results="artifacts/stream-capabilities-retention/stream-capabilities-retention-$tfm.trx"
            outcomes() {
              grep -o "testName=\"Groundwork.StreamCapabilities.Tests.RetentionProofTests.$1\"[^>]*outcome=\"[A-Za-z]*\"" \
                "$results" | grep -c "outcome=\"$2\"" || true
            }
            while IFS= read -r proof; do
              passed=$(outcomes "$proof" Passed)
              notExecuted=$(outcomes "$proof" NotExecuted)
              echo "[$tfm] $proof passed: $passed, not executed: $notExecuted"
              if [ "$passed" -ne 1 ] || [ "$notExecuted" -ne 0 ]; then
                echo "::error::[$tfm] $proof did not execute. It may have been skipped as inconclusive after retries found no overlapping writers." >&2
                exit 1
              fi
            done <<< "$proofs"
          done
