name: Correctness

on:
  push:
    branches: [main, codex/groundwork-v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Emergency cost brake: set the repository variable GROUNDWORK_CI_PAUSED=true
  # to skip every billable correctness job without disabling Actions globally.
  architecture-boundaries:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Groundwork.slnx
      - run: dotnet test tests/Groundwork.Architecture.Tests/Groundwork.Architecture.Tests.csproj --no-restore --configuration Release
      - name: Run project board sync unit tests without credentials
        run: python3 -m unittest discover -s tests/project_board_sync -p 'test_*.py'

  build-and-test:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Groundwork.slnx
      - run: dotnet test Groundwork.slnx --no-restore --configuration Release --filter "Category!=Concurrency"

  documents-package-boundary:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Documents from a local package feed only
        run: tests/Groundwork.Documents.External/verify-local-package.sh

  public-api-acceptance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore the full solution
        run: dotnet restore Groundwork.slnx --nologo
      - name: Pack the public artifacts used by the acceptance consumer
        run: eng/pack-public-packages.sh artifacts/acceptance-packages
      - name: Run the clean-room public API journey twice from packed artifacts
        run: dotnet test tests/Groundwork.PublicApi.Acceptance.Tests/Groundwork.PublicApi.Acceptance.Tests.csproj --configuration Release

  query-differential:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      mongodb:
        image: mongo:7.0.24
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/Groundwork.Differential.Tests/Groundwork.Differential.Tests.csproj
      - name: Run four-provider query differential suite
        env:
          GW_EXPLAIN_ASSERT: "1"
          GW_EXPLAIN_ARTIFACT_DIR: ${{ github.workspace }}/TestResults/groundwork-explain
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/q4ci
        run: >-
          dotnet test tests/Groundwork.Differential.Tests --no-restore --configuration Release
          --logger "trx;LogFileName=differential.trx"
          --results-directory artifacts/differential
      # A four-provider proof whose live-provider cases skip is green and proves nothing:
      # unconfigured, the set-based mutation class reports one passed and three skipped and exit 0.
      # The job asserts the proofs executed rather than trusting the exit code.
      - name: Refuse a run whose set-based mutation proofs did not execute
        run: |
          outcomes() {
            grep -o "testName=\"Groundwork.Differential.Tests.SetMutationDifferentialTests[^\"]*\"[^>]*outcome=\"[A-Za-z]*\"" \
              artifacts/differential/*.trx | grep -c "outcome=\"$1\"" || true
          }
          executed=$(outcomes Passed)
          notExecuted=$(outcomes NotExecuted)
          echo "SetMutationDifferentialTests passed: $executed, not executed: $notExecuted"
          if [ "$executed" -lt 5 ] || [ "$notExecuted" -ne 0 ]; then
            echo "::error::The four-provider set-based mutation proofs did not run against every provider." >&2
            exit 1
          fi
      - name: Refuse a run whose LINQ query differential proofs did not execute
        run: |
          outcomes() {
            grep -o "testName=\"Groundwork.Differential.Tests.LinqExecutionDifferentialTests[^\"]*\"[^>]*outcome=\"[A-Za-z]*\"" \
              artifacts/differential/*.trx | grep -c "outcome=\"$1\"" || true
          }
          total=$(grep -o "testName=\"Groundwork.Differential.Tests.LinqExecutionDifferentialTests[^\"]*\"[^>]*outcome=\"[A-Za-z]*\"" \
              artifacts/differential/*.trx | wc -l)
          executed=$(outcomes Passed)
          notExecuted=$(outcomes NotExecuted)
          echo "LinqExecutionDifferentialTests total: $total, passed: $executed, not executed: $notExecuted"
          if [ "$total" -lt 10 ] || [ "$executed" -ne "$total" ] || [ "$notExecuted" -ne 0 ]; then
            echo "::error::The LINQ query differential proofs did not run against every configured provider." >&2
            exit 1
          fi
      - name: Upload native query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-explain-plans-${{ github.run_attempt }}
          path: TestResults/groundwork-explain
          if-no-files-found: error
          retention-days: 14

  sqlite-provider:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/Groundwork.Sqlite.Tests/Groundwork.Sqlite.Tests.csproj
      - run: >-
          dotnet test tests/Groundwork.Sqlite.Tests/Groundwork.Sqlite.Tests.csproj
          --no-restore --configuration Release --filter "Category!=Concurrency"

  event-log-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-event-log-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet eventlogrs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-event-log-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"eventlogrs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-event-log-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore tests/Groundwork.Samples.EventLog.Tests/Groundwork.Samples.EventLog.Tests.csproj
      - name: Run kernel-only event-log conformance
        env:
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/eventlog?replicaSet=eventlogrs&directConnection=true
        run: dotnet test tests/Groundwork.Samples.EventLog.Tests/Groundwork.Samples.EventLog.Tests.csproj --no-restore --configuration Release

  records-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      mongodb:
        image: mongo:7.0.24
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/Groundwork.Records.Tests/Groundwork.Records.Tests.csproj
      - name: Run typed Records proof across all four providers
        env:
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/recordsci
          GW_EXPLAIN_ASSERT: "1"
        run: dotnet test tests/Groundwork.Records.Tests/Groundwork.Records.Tests.csproj --no-restore --configuration Release

  sqlserver-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    name: SQL Server conformance (${{ matrix.target-framework }})
    runs-on: ubuntu-latest
    strategy:
      # A failed framework must not cancel the other leg: both target
      # frameworks are required evidence for this conformance job.
      fail-fast: false
      matrix:
        target-framework: [net8.0, net10.0]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins the .NET 10 SDK, while the net8.0 leg also needs
          # the .NET 8 runtime to execute its test assembly.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/Groundwork.SqlServer.Tests/Groundwork.SqlServer.Tests.csproj
      - name: Run SQL Server conformance suite (${{ matrix.target-framework }})
        env:
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.SqlServer.Tests/Groundwork.SqlServer.Tests.csproj
          --no-restore --configuration Release --framework ${{ matrix.target-framework }}
          --filter "Category!=Concurrency"
          --logger "trx;LogFileName=sqlserver-conformance-${{ matrix.target-framework }}.trx"
          --results-directory artifacts/sqlserver-conformance/${{ matrix.target-framework }}
      - name: Upload SQL Server conformance diagnostics (${{ matrix.target-framework }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-conformance-diagnostics-${{ matrix.target-framework }}
          path: artifacts/sqlserver-conformance/${{ matrix.target-framework }}/**
          if-no-files-found: ignore
          retention-days: 14

  provider-infrastructure:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7.0.24
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Confirm provider stacks
        run: |
          sqlite3 ':memory:' 'select 1;'
          test "${{ job.services.postgres.id }}" != ""
          test "${{ job.services.sqlserver.id }}" != ""
          test "${{ job.services.mongodb.id }}" != ""

  mongo-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet p1rs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"p1rs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Run MongoDB conformance suite
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/p1ci?replicaSet=p1rs&directConnection=true
        run: >-
          dotnet test tests/Groundwork.MongoDb.Tests/Groundwork.MongoDb.Tests.csproj
          --no-restore --configuration Release --filter "Category!=Concurrency"

  mongo-schema-tool:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-schema-tool-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet p35rs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-schema-tool-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"p35rs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-schema-tool-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Run the schema tool against a replica set
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/p35ci?replicaSet=p35rs&directConnection=true
        run: >-
          dotnet test tests/Groundwork.SchemaTool.Tests/Groundwork.SchemaTool.Tests.csproj
          --no-restore --configuration Release
          --logger "trx;LogFileName=schema-tool.trx"
          --results-directory artifacts/schema-tool
      # A suite whose live-provider proofs skip is green and proves nothing: unconfigured, this
      # project reports 45 passed, 7 skipped and exit 0. The job asserts the proofs executed rather
      # than trusting the exit code.
      - name: Refuse a run whose MongoDB proofs did not execute
        run: |
          results="artifacts/schema-tool/schema-tool.trx"
          outcomes() {
            grep -o "testName=\"Groundwork.SchemaTool.Tests.$1[^\"]*\"[^>]*outcome=\"[A-Za-z]*\"" \
              "$results" | grep -c "outcome=\"$2\"" || true
          }
          executed=$(outcomes SchemaToolMongoEndToEndTests Passed)
          notExecuted=$(outcomes SchemaToolMongoEndToEndTests NotExecuted)
          skipped=$(grep -c 'outcome="NotExecuted"' "$results" || true)
          echo "SchemaToolMongoEndToEndTests passed: $executed, not executed: $notExecuted"
          echo "Tests not executed in the whole suite: $skipped"
          if [ "$executed" -lt 7 ] || [ "$notExecuted" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "::error::The MongoDB schema-tool proofs did not run against the replica set." >&2
            exit 1
          fi

  mongo-standalone-exact-append:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.24
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Groundwork.slnx
      - name: Run standalone MongoDB exact-append capability refusal
        env:
          GROUNDWORK_MONGO_STANDALONE_CONNECTION: mongodb://localhost:27017/s6standalone
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release
          --filter FullyQualifiedName~MongoDB_without_transaction_fit_refuses
      - name: Run standalone MongoDB set-mutation capability proof
        env:
          GROUNDWORK_MONGO_STANDALONE_CONNECTION: mongodb://localhost:27017/s6setmutation
        run: >-
          dotnet test tests/Groundwork.MongoDb.Tests/Groundwork.MongoDb.Tests.csproj
          --no-restore --configuration Release
          --filter FullyQualifiedName~MongoSetMutationGuardTests.MongoDB_standalone_set_mutation

  capability-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-capability-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet capabilityrs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-capability-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"capabilityrs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-capability-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Run W1 native provider-command proof across all providers
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/w1ci?replicaSet=capabilityrs&directConnection=true
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: dotnet test tests/Groundwork.ProviderCommands.Tests/Groundwork.ProviderCommands.Tests.csproj --no-restore --configuration Release
      - name: Run S2 idempotency proof across all providers
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/s2ci?replicaSet=capabilityrs&directConnection=true
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter "(FullyQualifiedName~Idempotency)&(Category!=Concurrency)"
      - name: Run S6 exact append outcomes across all transaction-capable providers
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/s6ci?replicaSet=capabilityrs&directConnection=true
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter "(FullyQualifiedName~ExactAppend)&(Category!=Concurrency)"
      - name: Run S7 durable lifecycle capabilities across all transaction-capable providers
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/s7ci?replicaSet=capabilityrs&directConnection=true
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter "(FullyQualifiedName~Lifecycle)&(Category!=Concurrency)"
      - name: Run S4 native aggregation proof across all providers
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/s4ci?replicaSet=capabilityrs&directConnection=true
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter "(FullyQualifiedName~Aggregation)&(Category!=Concurrency)"
      - name: Run S11 unit-of-work query proof across relational providers
        env:
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release
          --filter "(FullyQualifiedName~UnitOfWorkQueryConformanceTests)&(Category!=Concurrency)"

  postgresql-provider:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Groundwork.slnx
      - name: Run PostgreSQL provider conformance
        env:
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
        run: >-
          dotnet test tests/Groundwork.PostgreSql.Tests/Groundwork.PostgreSql.Tests.csproj
          --no-restore --configuration Release --filter "Category!=Concurrency"

  mysql-provider:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROUNDWORK_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=groundwork;SslMode=None;Pooling=false
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: groundwork
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgroundwork --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/Groundwork.MySql.Tests/Groundwork.MySql.Tests.csproj
      - run: dotnet restore tests/Groundwork.SchemaTool.Tests/Groundwork.SchemaTool.Tests.csproj
      - name: Run MySQL provider conformance on both target frameworks
        run: |
          for tfm in net8.0 net10.0; do
            dotnet test tests/Groundwork.MySql.Tests/Groundwork.MySql.Tests.csproj \
              --no-restore --configuration Release --framework "$tfm" \
              --filter "Category!=Concurrency" \
              --logger "trx;LogFileName=mysql-conformance-$tfm.trx" \
              --results-directory "artifacts/mysql/$tfm"
          done
      - name: Run the schema tool against live MySQL
        run: >-
          dotnet test tests/Groundwork.SchemaTool.Tests/Groundwork.SchemaTool.Tests.csproj
          --no-restore --configuration Release
          --filter FullyQualifiedName~SchemaToolMySqlEndToEndTests
          --logger "trx;LogFileName=mysql-schema-tool.trx"
          --results-directory artifacts/mysql/schema-tool
      - name: Refuse a run whose MySQL proofs did not execute
        run: |
          conformance="Groundwork.MySql.Tests.MySqlProviderConformanceTests.Provider_passes_the_shipped_conformance_suite_on_both_surfaces"
          for tfm in net8.0 net10.0; do
            results="artifacts/mysql/$tfm/mysql-conformance-$tfm.trx"
            passed=$(grep -o "testName=\"$conformance\"[^>]*outcome=\"Passed\"" "$results" | wc -l || true)
            notExecuted=$(grep -c 'outcome="NotExecuted"' "$results" || true)
            echo "[$tfm] MySQL conformance passed: $passed, not executed: $notExecuted"
            if [ "$passed" -ne 1 ] || [ "$notExecuted" -ne 0 ]; then
              echo "::error::[$tfm] The live MySQL provider proofs were absent or skipped." >&2
              exit 1
            fi
          done

          results="artifacts/mysql/schema-tool/mysql-schema-tool.trx"
          proof="Groundwork.SchemaTool.Tests.SchemaToolMySqlEndToEndTests.Discovered_mysql_factory_plans_applies_and_reports_status_against_a_live_database"
          passed=$(grep -o "testName=\"$proof\"[^>]*outcome=\"Passed\"" "$results" | wc -l || true)
          notExecuted=$(grep -c 'outcome="NotExecuted"' "$results" || true)
          echo "MySQL schema-tool proof passed: $passed, not executed: $notExecuted"
          if [ "$passed" -ne 1 ] || [ "$notExecuted" -ne 0 ]; then
            echo "::error::The live MySQL schema-tool proof was absent or skipped." >&2
            exit 1
          fi
      - name: Upload MySQL diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-diagnostics-${{ github.run_attempt }}
          path: artifacts/mysql/**
          if-no-files-found: ignore
          retention-days: 14

  retention-correctness:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
      GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
      GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/retentioncorrectness?replicaSet=retentioncorrectnessrs&directConnection=true
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set for native retention
        run: |
          docker run --detach --name groundwork-retention-correctness-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet retentioncorrectnessrs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-retention-correctness-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"retentioncorrectnessrs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-retention-correctness-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
      - name: Run four-provider retention correctness (.NET 8)
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --framework net8.0
          --filter "(FullyQualifiedName~Retention)&(Category!=Concurrency)"
          --logger "trx;LogFileName=retention-correctness-net8.0.trx"
          --results-directory artifacts/retention-correctness
      - name: Run four-provider retention correctness (.NET 10)
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --framework net10.0
          --filter "(FullyQualifiedName~Retention)&(Category!=Concurrency)"
          --logger "trx;LogFileName=retention-correctness-net10.0.trx"
          --results-directory artifacts/retention-correctness
      - name: Upload retention correctness diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retention-correctness-diagnostics-${{ github.run_attempt }}
          path: artifacts/retention-correctness/**
          if-no-files-found: ignore
          retention-days: 14
