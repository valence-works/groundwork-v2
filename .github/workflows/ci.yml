name: CI

on:
  push:
    branches: [main, codex/groundwork-v2]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Groundwork.slnx
      - run: dotnet test tests/Groundwork.Architecture.Tests/Groundwork.Architecture.Tests.csproj --no-restore --configuration Release

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Groundwork.slnx
      - run: dotnet test Groundwork.slnx --no-restore --configuration Release

  sqlite-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Groundwork.Sqlite.Tests/Groundwork.Sqlite.Tests.csproj
      - run: dotnet test tests/Groundwork.Sqlite.Tests/Groundwork.Sqlite.Tests.csproj --no-restore --configuration Release

  provider-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7.0.24
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Confirm provider stacks
        run: |
          sqlite3 ':memory:' 'select 1;'
          test "${{ job.services.postgres.id }}" != ""
          test "${{ job.services.sqlserver.id }}" != ""
          test "${{ job.services.mongodb.id }}" != ""

  mongo-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet p1rs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"p1rs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Run MongoDB conformance suite
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/p1ci?replicaSet=p1rs&directConnection=true
        run: dotnet test tests/Groundwork.MongoDb.Tests/Groundwork.MongoDb.Tests.csproj --no-restore --configuration Release

  concurrency-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-w2-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet w2rs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-w2-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"w2rs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-w2-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Report provider coverage
        run: |
          {
            echo '### W2 provider coverage'
            echo
            echo '- InMemory: executed (reference adapter)'
            echo '- SQLite: executed (in-process adapter)'
            echo '- MongoDB: executed (live replica set)'
            echo '- PostgreSQL: executed (live service)'
            echo '- SQL Server: not executed — W2 adapter is not yet present'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run W2 concurrency conformance
        env:
          GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/w2ci?replicaSet=w2rs&directConnection=true
          GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
        run: dotnet test tests/Groundwork.Concurrency.Tests/Groundwork.Concurrency.Tests.csproj --no-restore --configuration Release
