name: CI

on:
  push:
    branches: [main, codex/groundwork-v2]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Groundwork.slnx
      - run: dotnet test Groundwork.slnx --no-restore --configuration Release

  provider-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7.0.24
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Confirm provider stacks
        run: |
          sqlite3 ':memory:' 'select 1;'
          test "${{ job.services.postgres.id }}" != ""
          test "${{ job.services.sqlserver.id }}" != ""
          test "${{ job.services.mongodb.id }}" != ""
