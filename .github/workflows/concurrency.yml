name: Concurrency

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
      full_solution_recurrence:
        description: Run the five-iteration unfiltered full-solution recurrence harness
        required: false
        default: false
        type: boolean
      upload_sensitive_recurrence_artifacts:
        description: Explicitly retain raw recurrence logs, TRX, and dumps for one day
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # The repository-level cost brake also suppresses automatic main-branch
  # concurrency evidence. Manual dispatch is available again after unpausing.
  concurrency-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/concurrencyci?replicaSet=concurrencyrs&directConnection=true
      GROUNDWORK_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=groundwork;SslMode=None;Pooling=false
      GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
      GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: groundwork
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgroundwork --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify the requested exact head
        env:
          EXPECTED_REF: ${{ inputs.ref || github.sha }}
        run: bash eng/verify-exact-head.sh "$EXPECTED_REF"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set
        run: |
          docker run --detach --name groundwork-concurrency-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet concurrencyrs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-concurrency-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"concurrencyrs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-concurrency-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore Groundwork.slnx
      - name: Report exact-head provider coverage
        run: |
          {
            echo '### Concurrency provider coverage'
            echo
            echo "- Commit: $GROUNDWORK_TESTED_SHA"
            echo '- InMemory: provider-neutral harness'
            echo '- SQLite: provider-neutral harness'
            echo '- MongoDB: live replica set harness'
            echo '- MySQL: live provider-neutral harness'
            echo '- PostgreSQL: live harness and async provider surfaces'
            echo '- SQL Server: batched lifecycle proof (full W2 runs in isolated matrix jobs)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run provider-neutral concurrency matrix (.NET 8)
        run: >-
          dotnet test tests/Groundwork.Concurrency.Tests/Groundwork.Concurrency.Tests.csproj
          --no-restore --configuration Release --framework net8.0
          --logger "trx;LogFileName=concurrency-net8.0.trx"
          --results-directory artifacts/concurrency/net8.0
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
      - name: Run provider-neutral concurrency matrix (.NET 10)
        run: >-
          dotnet test tests/Groundwork.Concurrency.Tests/Groundwork.Concurrency.Tests.csproj
          --no-restore --configuration Release --framework net10.0
          --logger "trx;LogFileName=concurrency-net10.0.trx"
          --results-directory artifacts/concurrency/net10.0
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
      - name: Refuse a run whose MySQL concurrency proofs did not execute
        run: |
          for tfm in net8.0 net10.0; do
            results="artifacts/concurrency/$tfm/concurrency-$tfm.trx"
            passed=$(grep -o 'testName="Groundwork.Concurrency.Tests.ConcurrencyHarnessTests.MySql_[^"]*"[^>]*outcome="Passed"' "$results" | wc -l || true)
            notExecuted=$(grep -o 'testName="Groundwork.Concurrency.Tests.ConcurrencyHarnessTests.MySql_[^"]*"[^>]*outcome="NotExecuted"' "$results" | wc -l || true)
            echo "[$tfm] MySQL concurrency proofs passed: $passed, not executed: $notExecuted"
            if [ "$passed" -ne 10 ] || [ "$notExecuted" -ne 0 ]; then
              echo "::error::[$tfm] The ten live MySQL concurrency proofs were absent or skipped." >&2
              exit 1
            fi
          done
      - name: Run PostgreSQL concurrency surfaces (.NET 8)
        run: >-
          dotnet test tests/Groundwork.PostgreSql.Tests/Groundwork.PostgreSql.Tests.csproj
          --no-restore --configuration Release --framework net8.0 --filter "Category=Concurrency"
          --logger "trx;LogFileName=postgresql-concurrency-net8.0.trx"
          --results-directory artifacts/concurrency/postgresql-net8.0
      - name: Run PostgreSQL concurrency surfaces (.NET 10)
        run: >-
          dotnet test tests/Groundwork.PostgreSql.Tests/Groundwork.PostgreSql.Tests.csproj
          --no-restore --configuration Release --framework net10.0 --filter "Category=Concurrency"
          --logger "trx;LogFileName=postgresql-concurrency-net10.0.trx"
          --results-directory artifacts/concurrency/postgresql-net10.0
      - name: Upload concurrency diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-diagnostics-${{ github.run_attempt }}
          path: artifacts/concurrency/**
          if-no-files-found: ignore
          retention-days: 14

  sqlserver-w2-conformance:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    name: SQL Server W2 (${{ matrix.target-framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target-framework: [net8.0, net10.0]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify the requested exact head
        env:
          EXPECTED_REF: ${{ inputs.ref || github.sha }}
        run: bash eng/verify-exact-head.sh "$EXPECTED_REF"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore tests/Groundwork.SqlServer.Tests/Groundwork.SqlServer.Tests.csproj
      - name: Run the full SQL Server W2 matrix (${{ matrix.target-framework }})
        env:
          GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
        run: >-
          dotnet test tests/Groundwork.SqlServer.Tests/Groundwork.SqlServer.Tests.csproj
          --no-restore --configuration Release --framework ${{ matrix.target-framework }}
          --filter "Category=Concurrency"
          --logger "trx;LogFileName=sqlserver-w2-${{ matrix.target-framework }}.trx"
          --results-directory artifacts/sqlserver-w2/${{ matrix.target-framework }}
          --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type full
      - name: Refuse a run whose SQL Server W2 proof did not execute exactly once (${{ matrix.target-framework }})
        env:
          TFM: ${{ matrix.target-framework }}
        run: |
          proof="Groundwork.SqlServer.Tests.SqlServerProviderTests.W2_concurrency_harness_holds_every_named_invariant_for_the_full_matrix"
          results="artifacts/sqlserver-w2/$TFM/sqlserver-w2-$TFM.trx"
          if [ ! -f "$results" ]; then
            echo "::error::[$TFM] SQL Server W2 TRX was not produced." >&2
            exit 1
          fi
          passed=$(grep -o "testName=\"$proof\"[^>]*outcome=\"Passed\"" "$results" | wc -l || true)
          notExecuted=$(grep -o "testName=\"$proof\"[^>]*outcome=\"NotExecuted\"" "$results" | wc -l || true)
          observed=$(grep -o "testName=\"$proof\"[^>]*outcome=\"[A-Za-z]*\"" "$results" | wc -l || true)
          echo "[$TFM] SQL Server W2 passed: $passed, not executed: $notExecuted, observed: $observed"
          if [ "$passed" -ne 1 ] || [ "$notExecuted" -ne 0 ] || [ "$observed" -ne 1 ]; then
            echo "::error::[$TFM] The SQL Server W2 proof was absent, skipped, or duplicated." >&2
            exit 1
          fi
      - name: Upload SQL Server W2 diagnostics (${{ matrix.target-framework }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-w2-diagnostics-${{ matrix.target-framework }}-${{ github.run_attempt }}
          path: artifacts/sqlserver-w2/${{ matrix.target-framework }}/**
          if-no-files-found: ignore
          retention-days: 14

  retention-concurrency:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROUNDWORK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=groundwork;Pooling=false
      GROUNDWORK_SQLSERVER_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=Groundwork!2026;TrustServerCertificate=True;Encrypt=False
      GROUNDWORK_MONGO_CONNECTION: mongodb://localhost:27017/retentionci?replicaSet=retentionrs&directConnection=true
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_PASSWORD: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Groundwork!2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Groundwork!2026' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify the requested exact head
        env:
          EXPECTED_REF: ${{ inputs.ref || github.sha }}
        run: bash eng/verify-exact-head.sh "$EXPECTED_REF"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize MongoDB replica set for native retention
        run: |
          docker run --detach --name groundwork-retention-mongo --publish 27017:27017 \
            mongo:7.0.24 --replSet retentionrs --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec groundwork-retention-mongo mongosh --quiet --eval \
              'rs.initiate({_id:"retentionrs",members:[{_id:0,host:"localhost:27017"}]})' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec groundwork-retention-mongo mongosh --quiet --eval 'rs.status().ok' | grep -qx 1
      - run: dotnet restore tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
      - name: Run four-provider retention concurrency proof (.NET 8)
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter "Category=Concurrency" --framework net8.0
          --logger "trx;LogFileName=stream-capabilities-retention-net8.0.trx"
          --results-directory artifacts/retention-concurrency
      - name: Run four-provider retention concurrency proof (.NET 10)
        run: >-
          dotnet test tests/Groundwork.StreamCapabilities.Tests/Groundwork.StreamCapabilities.Tests.csproj
          --no-restore --configuration Release --filter "Category=Concurrency" --framework net10.0
          --logger "trx;LogFileName=stream-capabilities-retention-net10.0.trx"
          --results-directory artifacts/retention-concurrency
      - name: Refuse a run whose OnAppend coalescing proofs did not execute
        run: |
          proofs="PostgreSQL_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline
          SQLServer_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline
          SQLite_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline
          SQLite_in_memory_OnAppend_serializes_the_shared_connection_and_coalesces_cleanup
          MongoDB_OnAppend_concurrent_writes_coalesce_below_the_serial_command_baseline"
          for tfm in net8.0 net10.0; do
            results="artifacts/retention-concurrency/stream-capabilities-retention-$tfm.trx"
            outcomes() {
              grep -o "testName=\"Groundwork.StreamCapabilities.Tests.RetentionProofTests.$1\"[^>]*outcome=\"[A-Za-z]*\"" \
                "$results" | grep -c "outcome=\"$2\"" || true
            }
            while IFS= read -r proof; do
              passed=$(outcomes "$proof" Passed)
              notExecuted=$(outcomes "$proof" NotExecuted)
              echo "[$tfm] $proof passed: $passed, not executed: $notExecuted"
              if [ "$passed" -ne 1 ] || [ "$notExecuted" -ne 0 ]; then
                echo "::error::[$tfm] $proof did not execute. It may have been skipped as inconclusive after retries found no overlapping writers." >&2
                exit 1
              fi
            done <<< "$proofs"
          done
      - name: Upload retention concurrency diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retention-concurrency-diagnostics-${{ github.run_attempt }}
          path: artifacts/retention-concurrency/**
          if-no-files-found: ignore
          retention-days: 14

  full-solution-recurrence:
    if: ${{ vars.GROUNDWORK_CI_PAUSED != 'true' && inputs.full_solution_recurrence }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Verify the requested exact head
        env:
          EXPECTED_REF: ${{ inputs.ref }}
        run: bash eng/verify-exact-head.sh "$EXPECTED_REF"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run five full-solution recurrence iterations
        env:
          EXPECTED_REF: ${{ inputs.ref }}
          GROUNDWORK_CONFIRM_IDLE_HOST: "true"
          GROUNDWORK_SUPPRESS_RAW_OUTPUT: "true"
        run: bash eng/run-full-solution-recurrence.sh "$EXPECTED_REF"
      - name: Prepare publication-safe recurrence summary
        if: always()
        run: bash eng/prepare-recurrence-summary.sh artifacts/recurrence/full-solution
      - name: Upload recurrence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-solution-recurrence-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/recurrence/full-solution/**/summary.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload explicitly authorized sensitive recurrence diagnostics
        if: ${{ always() && inputs.upload_sensitive_recurrence_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: SENSITIVE-full-solution-recurrence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/recurrence/full-solution/**
          if-no-files-found: warn
          retention-days: 1
